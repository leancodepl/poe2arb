name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify code formatting
        run: |
          test -z $(go tool gofumpt -l .)

      - name: Run linter
        if: always()
        run: |
          go tool staticcheck ./...

      - name: Run tests with coverage
        if: always()
        run: go test -cover ./...

  integration-test:
    name: Integration test with Flutter ${{ matrix.flutter_version }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        flutter_version: ['3.16']

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          go build
          mv ./poe2arb /usr/local/bin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '${{ matrix.flutter_version }}'

      - name: Run integration test
        env:
          # Read-only POEditor token for albert+poe2arb@...
          POEDITOR_TOKEN: ${{ secrets.POEDITOR_INTEGRATION_TESTS_TOKEN }}
        working-directory: integration_test
        run: |
          poe2arb poe
          poe2arb poe --output-dir lib/l10n_prefixed --term-prefix prefixed
          flutter gen-l10n

      - name: Print ARBs
        working-directory: integration_test
        run: |
          for dir in l10n l10n_prefixed; do
            for locale in en pl en_hk sr sr_cyrl es es_419; do
              echo "=== lib/$dir/app_$locale.arb ==="
              cat lib/$dir/app_$locale.arb
            done
          done

  write-integration-test:
    name: Write integration test (seed + upload)
    # Skips on PRs from contributors who don't have access to the write
    # secrets, and on forks. Set the POEDITOR_INTEGRATION_TESTS_WRITE_PROJECT_ID
    # repo variable to enable.
    if: ${{ vars.POEDITOR_INTEGRATION_TESTS_WRITE_PROJECT_ID != '' }}

    runs-on: ubuntu-latest

    # The write test mutates a shared POEditor project. Avoid running multiple
    # instances of this job in parallel — concurrency: cancel-in-progress
    # ensures only the latest run holds the lock.
    concurrency:
      group: poeditor-write-integration
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          go build
          mv ./poe2arb /usr/local/bin

      - name: Run write integration test
        env:
          # Write-access POEditor token for the dedicated test project.
          POEDITOR_TOKEN: ${{ secrets.POEDITOR_INTEGRATION_TESTS_WRITE_TOKEN }}
          POE_PROJECT_ID: ${{ vars.POEDITOR_INTEGRATION_TESTS_WRITE_PROJECT_ID }}
        working-directory: integration_test
        run: ./scripts/run_write_test.sh
